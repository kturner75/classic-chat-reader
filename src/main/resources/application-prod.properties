# Production profile (PostgreSQL target)

spring.datasource.url=${PDR_DATABASE_URL:${SPRING_DATASOURCE_URL:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${PDR_DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
spring.datasource.password=${PDR_DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.flyway.user=${SPRING_FLYWAY_USER:${DB_MIGRATOR_USER:${PDR_DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:}}}}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:${DB_MIGRATOR_PASSWORD:${PDR_DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}}}

# Schema is migration-owned in production
spring.jpa.hibernate.ddl-auto=validate
security.public.rate-limit.store=database
account.auth.rollout.mode=${ACCOUNT_AUTH_ROLLOUT_MODE:optional}
account.auth.rollout.allowed-emails=${ACCOUNT_AUTH_ROLLOUT_ALLOWED_EMAILS:}
account.auth.google.enabled=${ACCOUNT_AUTH_GOOGLE_ENABLED:false}
account.auth.google.client-id=${ACCOUNT_AUTH_GOOGLE_CLIENT_ID:}
account.auth.google.client-secret=${ACCOUNT_AUTH_GOOGLE_CLIENT_SECRET:}
account.auth.google.redirect-uri=${ACCOUNT_AUTH_GOOGLE_REDIRECT_URI:}
account.auth.password-reset.public-base-url=${APP_PUBLIC_BASE_URL:https://classicchatreader.com}
email.from=${EMAIL_FROM:Classic Chat Reader <no-reply@classicchatreader.com>}

# FERPA / SECURITY_AUDIT C-01 + H-07: never ship prod in local (ungated) mode.
# Boot refuses to start if these are overridden off or auth material is missing.
deployment.mode=public
security.public.session.secure-cookie=true
account.auth.secure-cookie=true

# Public deployment serves curated, pre-generated artifacts only by default.
# Override in app.env if the server is intentionally provisioned for live generation.
tts.cache-only=true
generation.cache-only=true
generation.queue.recovery.enabled=false
book-cover.cdn.enabled=${BOOK_COVER_CDN_ENABLED:true}
character.portrait.cdn.enabled=${CHARACTER_PORTRAIT_CDN_ENABLED:true}
illustration.cdn.enabled=${ILLUSTRATION_CDN_ENABLED:true}

# HMAC secret for student quiz contentVersion tokens (required across multi-instance).
quiz.content-version-secret=${QUIZ_CONTENT_VERSION_SECRET:}

# FERPA (2026-10-31): student chat text goes to the OpenAI API (no training on API data), not the
# xAI SuperGrok subscription. Covers character chat, recap chat and Reading Buddy. With no
# CCR_OPENAI_API_KEY the provider falls back to local Ollama, which production doesn't run, so chat
# reports unavailable; it never falls back to xAI.
ai.chat.provider=${AI_CHAT_PROVIDER:openai}
ai.chat.openai.model=${AI_CHAT_OPENAI_MODEL:gpt-5.4-mini}

# Voice calls always use xAI realtime (no OpenAI path) and stream student audio there, so they
# stay off in production until xAI API terms cover students. Leave VOICE_CALL_ENABLED unset.
voice.call.enabled=${VOICE_CALL_ENABLED:false}

# FERPA term retention purge (BL-043.6 part 3): production holds the real classroom records, so the
# nightly purge runs here. Duration stays classroom.ferpa.term-retain-days (placeholder 400).
classroom.ferpa.purge-enabled=${CLASSROOM_PURGE_ENABLED:true}
