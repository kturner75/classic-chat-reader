# No default datasource. A profile must be active to supply spring.datasource.*:
# - Local development (PostgreSQL): --spring.profiles.active=local-dev
# - Production (PostgreSQL):        --spring.profiles.active=prod
# - Production (MariaDB):           --spring.profiles.active=mariadb
# Running with no profile fails fast at startup rather than silently using a
# throwaway database.
spring.config.import=optional:file:.env.local[.properties]
spring.datasource.url=${DATABASE_URL}

spring.jpa.show-sql=false

spring.h2.console.enabled=false

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# TTS Configuration (xAI / SuperGrok OAuth, same credentials as chat)
tts.xai.api-key=${XAI_API_KEY:}
tts.xai.default-voice=orion
tts.xai.timeout-seconds=45
tts.xai.language=en
tts.cache-dir=./data/audio
tts.cache-only=false

# AI Feature Flags
ai.reasoning.enabled=true
# Controls chat APIs (character chat, recap chat) and reading-buddy status availability.
# Independent of generation.cache-only.
ai.chat.enabled=true

# Reasoning Provider (character extraction, voice analysis, prompt generation)
ai.reasoning.provider=xai
ai.reasoning.timeout-seconds=180

# Reasoning - Ollama config
ai.reasoning.ollama.base-url=http://localhost:11434
ai.reasoning.ollama.model=llama3.1:latest

# Reasoning - xAI config (SuperGrok OAuth when configured, else XAI_API_KEY)
ai.reasoning.xai.api-key=${XAI_API_KEY:}
ai.reasoning.xai.model=grok-4.6

# Reasoning - OpenAI config (opt-in via ai.reasoning.provider=openai)
ai.reasoning.openai.base-url=https://api.openai.com/v1
ai.reasoning.openai.api-key=${OPENAI_API_KEY:}
ai.reasoning.openai.model=gpt-5.5

# Chat Provider (character chat, recap chat, reading buddy)
ai.chat.provider=xai
ai.chat.timeout-seconds=60

# Chat - Ollama config (for local testing)
ai.chat.ollama.base-url=http://localhost:11434
ai.chat.ollama.model=llama3.1:latest

# Chat - xAI config. grok-4.6 is what SuperGrok OAuth can actually serve in production.
# Default high reasoning is 30s+; force low effort for interactive chat (cannot be disabled).
# grok-4.20-*-non-reasoning is faster on API keys but has hung until the 60s client timeout
# on SuperGrok subscription tokens.
ai.chat.xai.api-key=${XAI_API_KEY:}
ai.chat.xai.model=grok-4.6
ai.chat.xai.reasoning-effort=low

# Chat - OpenAI config (opt-in via ai.chat.provider=openai)
ai.chat.openai.base-url=https://api.openai.com/v1
ai.chat.openai.api-key=${OPENAI_API_KEY:}
ai.chat.openai.model=gpt-5.5

# Voice calls (xAI Realtime speech-to-speech) - always xAI, independent of ai.chat.provider.
# The browser connects to wss://api.x.ai/v1/realtime directly using an ephemeral token
# minted server-side; audio never flows through this server.
voice.call.enabled=true
voice.call.xai.api-key=${XAI_API_KEY:}
voice.call.xai.model=grok-voice-think-fast-2.0
voice.call.token-ttl-seconds=1800
voice.call.timeout-seconds=15
voice.call.max-context-messages=10
voice.call.vad.threshold=0.5
voice.call.vad.silence-duration-ms=600
voice.call.vad.idle-timeout-ms=30000
# Voice roster for TTS and character voice selection - fetched from GET /v1/tts/voices,
# merged with documented personalities, cached in memory and on disk.
voice.call.xai.voices-url=https://api.x.ai/v1/tts/voices
voice.call.voice-catalog.timeout-seconds=10
voice.call.voice-catalog.cache-ttl-minutes=1440
voice.call.voice-catalog.cache-file=./data/xai-voice-catalog.json

# xAI OAuth (SuperGrok subscription) - optional, shared by all xAI-backed providers above.
# Refresh token is minted manually via scripts/xai-oauth-login.sh, not obtained by the app.
# When unset, all xAI providers use their configured api-key exactly as before.
ai.xai.oauth.enabled=true
ai.xai.oauth.refresh-token=${XAI_OAUTH_REFRESH_TOKEN:}
# xAI rotates the refresh token on every use; the newest one is persisted here so restarts
# don't retry the (by then invalidated) value from XAI_OAUTH_REFRESH_TOKEN above.
ai.xai.oauth.refresh-token-file=./data/xai-oauth-refresh-token

# ComfyUI Configuration
comfyui.base-url=http://127.0.0.1:8188
comfyui.workflow-timeout=120000
comfyui.checkpoint=dreamshaperXL_lightningDPMSDE.safetensors

# Illustration Configuration
illustration.cache-dir=./data/illustrations
illustration.image-width=768
illustration.image-height=1024
illustration.sampler-steps=20
illustration.cfg-scale=8
illustration.allow-prompt-editing=true
book-cover.cache-dir=./data/book-covers
book-cover.width=768
book-cover.height=1024
book-cover.generation.lease-minutes=20
book-cover.generation.provider=comfyui
book-cover.generation.timeout-seconds=180
book-cover.xai.base-url=https://api.x.ai/v1
book-cover.xai.api-key=${XAI_API_KEY:}
book-cover.xai.model=grok-imagine-image
book-cover.xai.aspect-ratio=3:4
book-cover.xai.resolution=2k
book-cover.openai.base-url=https://api.openai.com/v1
book-cover.openai.api-key=${OPENAI_API_KEY:}
book-cover.openai.model=gpt-image-1
book-cover.openai.size=1024x1536
book-cover.openai.quality=high
book-cover.openai.output-format=png
# Manual cover uploads can be several MB when exported as PNG from image generation tools.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
# Generated covers are served from the app by default because local generation does not upload to the CDN.
book-cover.cdn.enabled=false
# Lease window for illustration generation workers; expired leases can be reclaimed by another worker.
illustration.generation.lease-minutes=20
# Optional stable worker identifier for illustration lease ownership.
illustration.generation.worker-id=${HOSTNAME:}

# Character Feature Configuration
character.enabled=true
# Stable signing secret keeps My Chats cursors valid across restarts/instances.
# When unset, a per-process random key is used and outstanding cursors expire on restart.
account.chat.cursor-secret=${ACCOUNT_CHAT_CURSOR_SECRET:}
character.portrait.width=512
character.portrait.height=640
# Portrait image provider: comfyui | xai (Grok Imagine). xAI prefers SuperGrok OAuth and
# falls back to XAI_API_KEY. comfyui requires a local server on comfyui.base-url.
character.portrait.generation.provider=xai
character.portrait.generation.timeout-seconds=180
character.portrait.xai.model=grok-imagine-image
character.portrait.xai.aspect-ratio=3:4
character.portrait.xai.resolution=1k
character.portrait.cache-dir=./data/character-portraits
character.extraction.max-characters-per-chapter=5
# Chapter text budget for character extraction. Median chapter is ~12k chars, p95 ~37k;
# raise toward 40000 for full p95 coverage at higher token cost (see BL-042).
character.extraction.max-context-chars=24000
character.chat.max-context-messages=10
# Lease windows for character analysis + portrait workers.
character.analysis.lease-minutes=15
character.portrait.lease-minutes=20
# Optional stable worker identifier for character lease ownership.
character.generation.worker-id=${HOSTNAME:}

# Recap Feature Configuration
recap.enabled=true
recap.rollout.mode=all
recap.rollout.allowed-book-ids=
recap.reasoning.provider=${ai.reasoning.provider:xai}
recap.reasoning.timeout-seconds=${ai.reasoning.timeout-seconds:180}
recap.reasoning.ollama.base-url=${ai.reasoning.ollama.base-url:http://localhost:11434}
recap.reasoning.ollama.model=${ai.reasoning.ollama.model:llama3.1:latest}
recap.reasoning.xai.api-key=${ai.reasoning.xai.api-key:}
recap.reasoning.xai.model=${ai.reasoning.xai.model:grok-4.6}
recap.reasoning.openai.base-url=${ai.reasoning.openai.base-url:https://api.openai.com/v1}
recap.reasoning.openai.api-key=${ai.reasoning.openai.api-key:${OPENAI_API_KEY:}}
recap.reasoning.openai.model=${ai.reasoning.openai.model:gpt-5.5}
# Lease window for recap workers; when it expires, another worker may claim stale recap jobs.
recap.generation.lease-minutes=20
# Optional stable worker identifier for recap lease ownership (defaults to HOSTNAME when set).
recap.generation.worker-id=${HOSTNAME:}

# Quiz Feature Configuration
quiz.enabled=true
# HMAC secret for student quiz contentVersion tokens. Leave empty for ephemeral
# per-process secret (local/dev). Set a stable value in shared/prod so in-flight
# quiz sessions survive restarts: quiz.content-version-secret=${QUIZ_CONTENT_VERSION_SECRET:}
quiz.content-version-secret=${QUIZ_CONTENT_VERSION_SECRET:}
quiz.reasoning.provider=${ai.reasoning.provider:xai}
quiz.reasoning.timeout-seconds=${ai.reasoning.timeout-seconds:180}
quiz.reasoning.ollama.base-url=${ai.reasoning.ollama.base-url:http://localhost:11434}
quiz.reasoning.ollama.model=${ai.reasoning.ollama.model:llama3.1:latest}
quiz.reasoning.xai.api-key=${ai.reasoning.xai.api-key:}
quiz.reasoning.xai.model=${ai.reasoning.xai.model:grok-4.6}
quiz.reasoning.openai.base-url=${ai.reasoning.openai.base-url:https://api.openai.com/v1}
quiz.reasoning.openai.api-key=${ai.reasoning.openai.api-key:${OPENAI_API_KEY:}}
quiz.reasoning.openai.model=${ai.reasoning.openai.model:gpt-5.5}
quiz.generation.questions-per-chapter=3
quiz.generation.max-questions=5
quiz.generation.max-context-chars=7000
quiz.difficulty.ramp.enabled=true
quiz.difficulty.ramp.chapter-step=6
quiz.difficulty.ramp.max-level=3
quiz.difficulty.ramp.question-boost-per-level=1

# Speed Reading Feature Configuration
speed-reading.enabled=true

# Reading Buddy Mode (optional companion commentary + chat).
# ROLLOUT: keep reading-buddy.enabled=false in production until the required spoiler
# acceptance suite (ReadingBuddySpoilerAcceptanceTest) and Playwright e2e smoke
# (e2e/reading-buddy.spec.js) are green. Requires ai.chat.enabled=true and a
# healthy chatLlmProvider. Availability API: GET /api/reading-buddy/status
# (not FeatureController). Public mode: POST /chat uses CHAT rate-limit bucket;
# POST /check-comment uses dedicated buddy-check bucket (see security.public.rate-limit.*).
reading-buddy.enabled=false
reading-buddy.min-paragraph-gap.rare=8
reading-buddy.min-paragraph-gap.occasional=4
reading-buddy.min-paragraph-gap.chatty=2
reading-buddy.min-cooldown-ms.rare=180000
reading-buddy.min-cooldown-ms.occasional=90000
reading-buddy.min-cooldown-ms.chatty=45000
reading-buddy.max-comments-per-chapter=6
reading-buddy.max-comments-per-hour=12
reading-buddy.proactive.max-words=60
reading-buddy.chat.max-words=150
reading-buddy.chat.max-context-messages=12
reading-buddy.memory.summary-max-chars=1500
reading-buddy.memory.recent-messages=20
reading-buddy.memory.summary-every-messages=8
# Prune to this cap after a successful rolling-summary refresh.
reading-buddy.memory.max-retained-messages=100
reading-buddy.quiet-default-minutes=45
reading-buddy.user-message-max-chars=2000
reading-buddy.post-chat-paragraph-gap=4
# Spoiler-safe STORY CONTEXT window (paragraph source text up to current position only)
reading-buddy.story-context.max-source-chars=4000
reading-buddy.story-context.prior-paragraphs=2
reading-buddy.story-context.include-chapter-first-paragraph=true

# Catalog discovery mode
# curated: use local curated list for landing-page discover/search (no live Gutendex query at search time)
# full: query live Gutendex for discover/search
library.catalog.mode=curated

# Classroom Demo Context (BL-018.6)
# Classroom mode: demo | database | hybrid (DB membership first, demo fallback).
classroom.mode=hybrid
# IANA zone for calendar DATE open-day gates (available_from). Empty = JVM default.
classroom.calendar-zone=
# Invite lifecycle (BL-043.4 / M-03): default expiry + max uses on create; create rotates the previous code.
classroom.invite.default-ttl-days=30
classroom.invite.default-max-uses=40
# Off by default; when enabled (and mode allows demo), landing page switches to assignment-first classroom variant.
classroom.demo.enabled=false
classroom.demo.class-id=
classroom.demo.class-name=
classroom.demo.teacher-name=
classroom.demo.features.quiz-enabled=true
classroom.demo.features.recap-enabled=true
classroom.demo.features.tts-enabled=true
classroom.demo.features.illustration-enabled=true
classroom.demo.features.character-enabled=true
classroom.demo.features.chat-enabled=true
classroom.demo.features.speed-reading-enabled=true
classroom.demo.features.reading-buddy-enabled=true

# Deployment/Security Configuration
# local: no auth gate for generation/chat endpoints.
# public: sensitive generation/chat endpoints require auth (X-API-Key or collaborator session) and apply per-IP rate limits.
deployment.mode=local
security.public.api-key=${PUBLIC_API_KEY:}
security.public.collaborator.password=${PUBLIC_COLLABORATOR_PASSWORD:}
security.public.session.cookie-name=pdr_collab_session
security.public.session.ttl-minutes=480
# Set true when serving over HTTPS so collaborator session cookies are sent only on secure transport.
security.public.session.secure-cookie=false
security.public.rate-limit.window-seconds=60
security.public.rate-limit.generation-requests=30
security.public.rate-limit.chat-requests=45
# Proactive reading-buddy check-comment (separate from shared CHAT bucket)
security.public.rate-limit.buddy-check-requests=30
security.public.rate-limit.authenticated-generation-requests=60
security.public.rate-limit.authenticated-chat-requests=90
security.public.rate-limit.authenticated-buddy-check-requests=60
# Rate-limit state store: in-memory (single-instance) or database (multi-instance resilient).
security.public.rate-limit.store=in-memory
# Cleanup cadence (request ticks) for stale limiter windows when using database store.
security.public.rate-limit.cleanup-interval=256
security.public.rate-limit.max-keys=20000
# Anonymous reader profile cookie used for per-reader annotations/bookmarks.
reader.profile.cookie-name=pdr_reader_profile

# Reader Account Auth (BL-021)
# Separate from collaborator auth (`/api/auth`) used for public-mode operational access.
account.auth.enabled=true
account.auth.rollout.mode=optional
account.auth.rollout.allowed-emails=
account.auth.cookie-name=pdr_account_session
account.auth.session.ttl-minutes=43200
account.auth.secure-cookie=${security.public.session.secure-cookie:false}
account.auth.password.min-length=10
account.auth.password.bcrypt-strength=12
account.auth.login.lockout.threshold=5
account.auth.login.lockout.base-delay-seconds=30
account.auth.login.lockout.max-delay-seconds=900
account.auth.rate-limit.window-seconds=60
account.auth.rate-limit.register.ip-max-requests=12
account.auth.rate-limit.register.email-max-requests=6
account.auth.rate-limit.login.ip-max-requests=40
account.auth.rate-limit.login.email-max-requests=12
account.auth.rate-limit.max-keys=20000
account.auth.google.enabled=${ACCOUNT_AUTH_GOOGLE_ENABLED:false}
account.auth.google.client-id=${ACCOUNT_AUTH_GOOGLE_CLIENT_ID:}
account.auth.google.client-secret=${ACCOUNT_AUTH_GOOGLE_CLIENT_SECRET:}
account.auth.google.redirect-uri=${ACCOUNT_AUTH_GOOGLE_REDIRECT_URI:}
account.auth.google.authorization-uri=${ACCOUNT_AUTH_GOOGLE_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
account.auth.google.token-uri=${ACCOUNT_AUTH_GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
account.auth.google.jwk-set-uri=${ACCOUNT_AUTH_GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
account.auth.google.allowed-issuers=${ACCOUNT_AUTH_GOOGLE_ALLOWED_ISSUERS:https://accounts.google.com,accounts.google.com}
account.auth.google.request-ttl-minutes=${ACCOUNT_AUTH_GOOGLE_REQUEST_TTL_MINUTES:10}

# Generation Configuration
# When true, artifact generation requests are blocked to avoid paid generation on cache misses.
# Applies to recap/quiz generation and other background generation pipelines.
# Does NOT disable chat APIs; chat is controlled by ai.chat.enabled + chat provider availability.
generation.cache-only=false
# When true, queue-backed generation services requeue persisted pending/stuck work on app startup.
generation.queue.recovery.enabled=true
# Max generation attempts per job (initial attempt + retries).
generation.retry.max-attempts=3
# Base delay before retrying failed generation work.
generation.retry.initial-delay-seconds=30
# Cap on exponential retry backoff delay.
generation.retry.max-delay-seconds=600

# Asset CDN Configuration
# Keep this pointed at the existing Spaces CDN until a replacement endpoint exists and cached assets are copied.
assets.cdn-base-url=${ASSETS_CDN_BASE_URL:https://public-domain-reader.atl1.cdn.digitaloceanspaces.com}
assets.cdn-prefix=assets

# Pre-generation Configuration
pregen.poll-interval-seconds=10
pregen.max-wait-minutes=120
pregen.stall-threshold-polls=30
pregen.cooldown-minutes=10
recap.generation.stuck-threshold-minutes=15
