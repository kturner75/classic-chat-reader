# MariaDB production profile (alternative to PostgreSQL)

spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:}}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}

# Schema is migration-owned in production
spring.jpa.hibernate.ddl-auto=validate
security.public.rate-limit.store=database

# Same fail-closed pins as application-prod.properties (BL-043.1 / BL-043.12).
deployment.mode=public
security.public.session.secure-cookie=true
account.auth.secure-cookie=true

# Public MariaDB deploys serve generated art from the CDN, same as prod.
book-cover.cdn.enabled=${BOOK_COVER_CDN_ENABLED:true}
character.portrait.cdn.enabled=${CHARACTER_PORTRAIT_CDN_ENABLED:true}
illustration.cdn.enabled=${ILLUSTRATION_CDN_ENABLED:true}
