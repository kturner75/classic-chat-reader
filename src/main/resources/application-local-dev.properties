# Local dev profile (PostgreSQL target)

spring.datasource.url=${PDR_DATABASE_URL:jdbc:postgresql://localhost:5432/classic_chat_reader}
spring.datasource.username=${PDR_DATABASE_USERNAME:}
spring.datasource.password=${PDR_DATABASE_PASSWORD:}
#generation.queue.recovery.enabled=false
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.user=${DB_MIGRATOR_USER:pdr_migrator}
spring.flyway.password=${DB_MIGRATOR_PASSWORD:${PDR_DATABASE_PASSWORD:}}

# Schema is migration-owned in production
spring.jpa.hibernate.ddl-auto=validate
security.public.rate-limit.store=database

deployment.mode=local

# Chat (reading buddy, character chat, etc.) — xAI / SuperGrok OAuth by default locally.
ai.chat.provider=xai
ai.chat.xai.api-key=${XAI_API_KEY:}
ai.chat.xai.model=grok-4.6

# OpenAI remains available as an opt-in override (ai.chat.provider=openai).
ai.chat.openai.api-key=${OPENAI_API_KEY:}
ai.chat.openai.model=gpt-5.5

# xAI OAuth / API key for chat, reasoning, and voice calls.
ai.xai.oauth.refresh-token=${XAI_OAUTH_REFRESH_TOKEN:}
